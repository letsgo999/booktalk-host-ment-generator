<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>북톡방 독서토론 멘트 생성기</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;
        const { 
            BookOpen, 
            Link: LinkIcon, 
            MessageSquare, 
            Send, 
            Loader2, 
            Sparkles, 
            User, 
            CheckCircle2, 
            AlertCircle 
        } = lucide;

        // --- 앱 환경 설정 ---
        // 실제 작동을 위해서는 여기에 Gemini API Key를 입력해야 합니다.
        const apiKey = ""; 

        const App = () => {
            const [url, setUrl] = useState('');
            const [loading, setLoading] = useState(false);
            const [result, setResult] = useState(null);
            const [error, setError] = useState(null);

            const fetchBookInfoAndGenerate = async (targetUrl) => {
                setLoading(true);
                setError(null);
                setResult(null);

                // 만약 API 키가 없다면 테스트용 샘플 데이터를 보여줍니다 (브라우저 테스트용)
                if (!apiKey) {
                    setTimeout(() => {
                        setResult({
                            bookTitle: "테스트 도서: 퓨처 셀프",
                            intro: "어느덧 5월의 싱그러운 바람이 창가를 스치는 계절입니다. 우리는 늘 더 나은 미래를 꿈꾸지만, 정작 오늘 내가 만나는 '미래의 나'는 어떤 모습일지 고민해 본 적이 있으신가요? 이번 북톡방에서는 '미래의 나'를 지금으로 불러오는 마법 같은 시간을 가져보려 합니다.",
                            themeQuestions: [
                                "당신이 그리는 10년 후의 '미래의 나'는 지금의 당신에게 어떤 조언을 건넬까요?",
                                "미래의 나를 방해하는 현재의 가장 큰 장애물은 무엇이라고 생각하시나요?",
                                "책에서 말하는 '우선순위의 재정립'을 위해 당장 오늘 저녁에 실천할 수 있는 작은 습관은?",
                                "나의 미래 모습이 이미 결정되어 있다고 믿을 때, 현재의 고통을 견디는 힘이 어떻게 달라질까요?",
                                "성공한 사람들의 공통점인 '미래 기억'을 우리 일상에 적용하는 구체적인 방법은?"
                            ],
                            presenterQuestions: [
                                "심리학적 관점에서 '미래의 나'와 연결되는 것이 뇌의 가소성에 어떤 영향을 주나요?",
                                "저자가 강조하는 '결과론적 사고'가 비즈니스 현장에서 자칫 위험할 수 있는 지점은 어디일까요?",
                                "한국의 독자들이 이 책의 개념을 받아들일 때 가장 괴리감을 느끼는 부분은 무엇이라 보십니까?"
                            ]
                        });
                        setLoading(false);
                        setError("※ 현재 API 키가 설정되지 않아 샘플 데이터를 표시합니다. 실제 분석을 원하시면 코드의 apiKey 변수에 키를 입력해 주세요.");
                    }, 1500);
                    return;
                }

                const systemPrompt = `당신은 [일욜밤 북톡방]의 전문 호스트입니다. 제공된 도서 URL의 정보를 분석하여 깊이 있는 토론 질문을 JSON으로 생성하세요.`;
                const userQuery = `이 도서 URL 분석: ${targetUrl}`;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: userQuery }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] },
                            tools: [{ google_search: {} }],
                            generationConfig: { responseMimeType: "application/json" }
                        })
                    });

                    const data = await response.json();
                    const generatedContent = JSON.parse(data.candidates[0].content.parts[0].text);
                    setResult(generatedContent);
                } catch (err) {
                    setError("분석 중 오류가 발생했습니다. (API 키 확인 필요)");
                } finally {
                    setLoading(false);
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!url.trim()) return;
                fetchBookInfoAndGenerate(url);
            };

            return (
                <div className="min-h-screen flex flex-col text-slate-900">
                    <header className="bg-white border-b border-slate-200 py-6 px-4 sticky top-0 z-10">
                        <div className="max-w-3xl mx-auto flex items-center gap-3">
                            <div className="bg-blue-600 p-2 rounded-lg">
                                <BookOpen size={24} className="text-white" />
                            </div>
                            <div>
                                <h1 className="text-xl font-bold text-slate-800">북톡방 멘트 생성기</h1>
                                <p className="text-xs text-slate-500 font-medium">소셜스쿨 전용 호스트 지원 도구</p>
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 max-w-3xl mx-auto w-full p-4 py-8">
                        {!result && !loading && (
                            <div className="bg-white rounded-2xl shadow-xl border border-slate-200 p-8 md:p-12 text-center space-y-6">
                                <div className="bg-blue-50 w-20 h-20 rounded-full flex items-center justify-center mx-auto">
                                    <Sparkles size={40} className="text-blue-600" />
                                </div>
                                <div className="space-y-2">
                                    <h2 className="text-2xl font-bold text-slate-800">토론할 책의 URL 주소를 알려 주세요!</h2>
                                    <p className="text-slate-500">예스24, 알라딘 등의 도서 상세 페이지 링크를 넣어주세요.</p>
                                </div>
                                
                                <form onSubmit={handleSubmit} className="flex flex-col sm:flex-row gap-3">
                                    <div className="relative flex-1">
                                        <div className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
                                            <LinkIcon size={20} />
                                        </div>
                                        <input
                                            type="text"
                                            value={url}
                                            onChange={(e) => setUrl(e.target.value)}
                                            placeholder="도서 URL을 입력하세요..."
                                            className="w-full pl-12 pr-4 py-4 bg-slate-100 border-2 border-transparent rounded-xl focus:border-blue-500 focus:bg-white outline-none transition-all"
                                        />
                                    </div>
                                    <button
                                        type="submit"
                                        className="bg-blue-600 hover:bg-blue-700 text-white px-8 py-4 rounded-xl font-bold transition-all flex items-center justify-center gap-2 whitespace-nowrap shadow-lg shadow-blue-200"
                                    >
                                        생성하기
                                        <Send size={18} />
                                    </button>
                                </form>
                            </div>
                        )}

                        {loading && (
                            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-16 text-center space-y-4">
                                <Loader2 size={48} className="text-blue-600 animate-spin mx-auto" />
                                <div className="space-y-1">
                                    <p className="text-lg font-bold text-slate-800">책의 정보를 꼼꼼히 읽고 있습니다...</p>
                                    <p className="text-sm text-slate-500 italic">북톡방의 품격에 어울리는 통찰을 추출 중입니다.</p>
                                </div>
                            </div>
                        )}

                        {error && (
                            <div className="mb-6 bg-amber-50 border border-amber-200 rounded-xl p-4 flex items-start gap-3 text-amber-800 text-sm">
                                <AlertCircle size={18} className="shrink-0 mt-0.5" />
                                <p>{error}</p>
                            </div>
                        )}

                        {result && (
                            <div className="space-y-6">
                                <div className="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
                                    <div className="bg-slate-900 p-8 text-white">
                                        <div className="flex items-center gap-2 text-blue-400 mb-2 text-sm font-bold tracking-wider">
                                            <CheckCircle2 size={16} />
                                            ANALYSIS COMPLETE
                                        </div>
                                        <h2 className="text-3xl font-bold">{result.bookTitle}</h2>
                                    </div>
                                    
                                    <div className="p-8 space-y-10">
                                        <section className="space-y-4">
                                            <h3 className="flex items-center gap-2 text-slate-900 font-bold text-xl">
                                                <Sparkles size={20} className="text-blue-600" />
                                                오프닝 초대 멘트
                                            </h3>
                                            <div className="bg-slate-50 p-6 rounded-2xl border-l-4 border-blue-600 italic text-slate-700 leading-relaxed text-lg">
                                                "{result.intro}"
                                            </div>
                                        </section>

                                        <section className="space-y-4">
                                            <h3 className="flex items-center gap-2 text-slate-900 font-bold text-xl">
                                                <MessageSquare size={20} className="text-blue-600" />
                                                테마 토론 질문 5선
                                            </h3>
                                            <div className="grid gap-3">
                                                {result.themeQuestions.map((q, idx) => (
                                                    <div key={idx} className="flex gap-4 p-5 rounded-xl border border-slate-100 bg-white hover:border-blue-200 hover:shadow-md transition-all group">
                                                        <span className="flex items-center justify-center w-8 h-8 rounded-full bg-blue-100 text-blue-600 font-bold text-sm shrink-0">
                                                            {idx + 1}
                                                        </span>
                                                        <p className="text-slate-800 font-semibold leading-normal pt-1">{q}</p>
                                                    </div>
                                                ))}
                                            </div>
                                        </section>

                                        <section className="space-y-4">
                                            <h3 className="flex items-center gap-2 text-slate-900 font-bold text-xl">
                                                <User size={20} className="text-blue-600" />
                                                발제자 심층 질문 3선
                                            </h3>
                                            <div className="grid gap-3">
                                                {result.presenterQuestions.map((q, idx) => (
                                                    <div key={idx} className="flex gap-4 p-5 rounded-xl border border-slate-800/10 bg-slate-900 text-white">
                                                        <span className="flex items-center justify-center w-8 h-8 rounded-full bg-white/20 text-white font-bold text-sm shrink-0">
                                                            {idx + 1}
                                                        </span>
                                                        <p className="font-medium leading-normal pt-1">{q}</p>
                                                    </div>
                                                ))}
                                            </div>
                                        </section>
                                    </div>
                                    
                                    <div className="bg-slate-50 p-6 border-t border-slate-200 flex justify-center">
                                        <button 
                                            onClick={() => {setResult(null); setUrl(''); setError(null);}}
                                            className="text-sm font-bold text-slate-400 hover:text-blue-600 transition-colors uppercase tracking-widest"
                                        >
                                            ← Analyze New Book
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="py-10 text-center text-slate-400 text-xs">
                        <p className="mb-1 italic">Designed for Social School Sunday Night Book-Talk</p>
                        <p>© 2025 BookTalk Host Generator</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
