<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>북톡방 독서토론 멘트 생성기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // 수정된 부분: lucide -> lucideReact 로 변경해야 React 컴포넌트로 정상 작동합니다.
        const { 
            BookOpen, Link: LinkIcon, MessageSquare, Send, Loader2, 
            Sparkles, User, CheckCircle2, AlertCircle, Settings, X, Key
        } = lucideReact;

        const App = () => {
            const [url, setUrl] = useState('');
            const [tempApiKey, setTempApiKey] = useState('');
            const [activeApiKey, setActiveApiKey] = useState('');
            const [showSettings, setShowSettings] = useState(false);
            const [loading, setLoading] = useState(false);
            const [result, setResult] = useState(null);
            const [error, setError] = useState(null);

            // 초기 로드 시 로컬 스토리지에서 키 확인 (선택 사항)
            useEffect(() => {
                const savedKey = localStorage.getItem('btb_api_key');
                if (savedKey) setActiveApiKey(savedKey);
            }, []);

            const saveSettings = (e) => {
                e.preventDefault();
                setActiveApiKey(tempApiKey);
                localStorage.setItem('btb_api_key', tempApiKey);
                setShowSettings(false);
            };

            const fetchBookInfoAndGenerate = async (targetUrl) => {
                if (!activeApiKey) {
                    setError("분석을 시작하려면 먼저 우측 상단의 설정(⚙️) 아이콘을 눌러 Gemini API Key를 입력해 주세요.");
                    setShowSettings(true);
                    return;
                }

                setLoading(true);
                setError(null);
                setResult(null);

                const systemPrompt = `당신은 [일욜밤 북톡방]의 전문 호스트입니다. 제공된 도서 URL의 정보를 분석하여 깊이 있는 토론 질문을 JSON으로 생성하세요.`;
                const userQuery = `이 도서 URL 분석: ${targetUrl}`;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${activeApiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: userQuery }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] },
                            tools: [{ google_search: {} }],
                            generationConfig: { responseMimeType: "application/json" }
                        })
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error?.message || "API 요청 중 문제가 발생했습니다.");
                    }

                    const data = await response.json();
                    const generatedContent = JSON.parse(data.candidates[0].content.parts[0].text);
                    setResult(generatedContent);
                } catch (err) {
                    setError(`오류 발생: ${err.message}. API 키가 유효한지 확인해 주세요.`);
                } finally {
                    setLoading(false);
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!url.trim()) return;
                fetchBookInfoAndGenerate(url);
            };

            return (
                <div className="min-h-screen flex flex-col text-slate-900">
                    {/* Header */}
                    <header className="bg-white border-b border-slate-200 py-4 px-6 sticky top-0 z-20 flex justify-between items-center shadow-sm">
                        <div className="flex items-center gap-3">
                            <div className="bg-blue-600 p-2 rounded-lg shadow-blue-200 shadow-lg">
                                <BookOpen size={20} className="text-white" />
                            </div>
                            <h1 className="text-lg font-bold text-slate-800">북톡방 멘트 생성기</h1>
                        </div>
                        <button 
                            onClick={() => setShowSettings(true)}
                            className={`p-2 rounded-full transition-colors ${activeApiKey ? 'text-slate-400 hover:bg-slate-100' : 'text-red-500 bg-red-50 animate-pulse'}`}
                        >
                            <Settings size={22} />
                        </button>
                    </header>

                    <main className="flex-1 max-w-3xl mx-auto w-full p-4 py-8">
                        {/* API Key Missing Alert */}
                        {!activeApiKey && !result && (
                            <div className="mb-6 bg-red-50 border border-red-100 rounded-xl p-4 flex items-center gap-3 text-red-700 text-sm">
                                <AlertCircle size={18} className="shrink-0" />
                                <p><strong>API 키 설정 필요:</strong> 도서 분석을 위해 우측 상단 설정을 클릭해 키를 입력해 주세요.</p>
                            </div>
                        )}

                        {!result && !loading && (
                            <div className="bg-white rounded-2xl shadow-xl border border-slate-200 p-8 md:p-12 text-center space-y-6">
                                <div className="bg-blue-50 w-20 h-20 rounded-full flex items-center justify-center mx-auto">
                                    <Sparkles size={40} className="text-blue-600" />
                                </div>
                                <div className="space-y-2">
                                    <h2 className="text-2xl font-bold text-slate-800">토론할 책의 URL 주소를 알려 주세요!</h2>
                                    <p className="text-slate-500">분석하고 싶은 도서 상세 페이지 링크를 입력하세요.</p>
                                </div>
                                
                                <form onSubmit={handleSubmit} className="flex flex-col sm:flex-row gap-3">
                                    <div className="relative flex-1">
                                        <div className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
                                            <LinkIcon size={20} />
                                        </div>
                                        <input
                                            type="text"
                                            value={url}
                                            onChange={(e) => setUrl(e.target.value)}
                                            placeholder="https://www.yes24.com/..."
                                            className="w-full pl-12 pr-4 py-4 bg-slate-100 border-2 border-transparent rounded-xl focus:border-blue-500 focus:bg-white outline-none transition-all font-medium"
                                        />
                                    </div>
                                    <button
                                        type="submit"
                                        className="bg-blue-600 hover:bg-blue-700 text-white px-8 py-4 rounded-xl font-bold transition-all flex items-center justify-center gap-2 shadow-lg shadow-blue-100"
                                    >
                                        생성하기
                                        <Send size={18} />
                                    </button>
                                </form>
                            </div>
                        )}

                        {loading && (
                            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-16 text-center space-y-4">
                                <Loader2 size={48} className="text-blue-600 animate-spin mx-auto" />
                                <p className="text-lg font-bold text-slate-800">도서 정보를 심층 분석 중입니다...</p>
                            </div>
                        )}

                        {error && (
                            <div className="mb-6 bg-red-50 border border-red-200 rounded-xl p-4 flex items-start gap-3 text-red-800 text-sm">
                                <AlertCircle size={18} className="shrink-0 mt-0.5" />
                                <p>{error}</p>
                            </div>
                        )}

                        {result && (
                            <div className="space-y-6">
                                <div className="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
                                    <div className="bg-slate-900 p-8 text-white">
                                        <div className="flex items-center gap-2 text-blue-400 mb-2 text-sm font-bold tracking-wider">
                                            <CheckCircle2 size={16} />
                                            ANALYSIS COMPLETE
                                        </div>
                                        <h2 className="text-2xl font-bold">{result.bookTitle}</h2>
                                    </div>
                                    
                                    <div className="p-8 space-y-10">
                                        <section className="space-y-4">
                                            <h3 className="flex items-center gap-2 text-slate-900 font-bold text-xl">
                                                <Sparkles size={20} className="text-blue-600" />
                                                오프닝 초대 멘트
                                            </h3>
                                            <div className="bg-slate-50 p-6 rounded-2xl border-l-4 border-blue-600 italic text-slate-700 leading-relaxed text-lg">
                                                "{result.intro}"
                                            </div>
                                        </section>

                                        <section className="space-y-4">
                                            <h3 className="flex items-center gap-2 text-slate-900 font-bold text-xl">
                                                <MessageSquare size={20} className="text-blue-600" />
                                                테마 토론 질문 5선
                                            </h3>
                                            <div className="grid gap-3">
                                                {result.themeQuestions.map((q, idx) => (
                                                    <div key={idx} className="flex gap-4 p-5 rounded-xl border border-slate-100 bg-white hover:border-blue-200 hover:shadow-md transition-all group">
                                                        <span className="flex items-center justify-center w-8 h-8 rounded-full bg-blue-100 text-blue-600 font-bold text-sm shrink-0">
                                                            {idx + 1}
                                                        </span>
                                                        <p className="text-slate-800 font-semibold leading-normal pt-1">{q}</p>
                                                    </div>
                                                ))}
                                            </div>
                                        </section>

                                        <section className="space-y-4">
                                            <h3 className="flex items-center gap-2 text-slate-900 font-bold text-xl">
                                                <User size={20} className="text-blue-600" />
                                                발제자 심층 질문 3선
                                            </h3>
                                            <div className="grid gap-3">
                                                {result.presenterQuestions.map((q, idx) => (
                                                    <div key={idx} className="flex gap-4 p-5 rounded-xl border border-slate-200 bg-slate-900 text-white">
                                                        <span className="flex items-center justify-center w-8 h-8 rounded-full bg-white/20 text-white font-bold text-sm shrink-0">
                                                            {idx + 1}
                                                        </span>
                                                        <p className="font-medium leading-normal pt-1">{q}</p>
                                                    </div>
                                                ))}
                                            </div>
                                        </section>
                                    </div>
                                    
                                    <div className="bg-slate-50 p-6 border-t border-slate-200 flex justify-center">
                                        <button 
                                            onClick={() => {setResult(null); setUrl(''); setError(null);}}
                                            className="text-sm font-bold text-slate-400 hover:text-blue-600 transition-colors uppercase tracking-widest"
                                        >
                                            ← Analyze New Book
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Settings Modal */}
                    {showSettings && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden animate-in zoom-in-95 duration-200">
                                <div className="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                                    <div className="flex items-center gap-2 font-bold text-slate-800">
                                        <Key size={18} className="text-blue-600" />
                                        API 설정
                                    </div>
                                    <button onClick={() => setShowSettings(false)} className="text-slate-400 hover:text-slate-600">
                                        <X size={20} />
                                    </button>
                                </div>
                                <form onSubmit={saveSettings} className="p-6 space-y-4">
                                    <div className="space-y-2">
                                        <label className="text-sm font-semibold text-slate-700">Gemini API Key</label>
                                        <input
                                            type="password"
                                            value={tempApiKey}
                                            onChange={(e) => setTempApiKey(e.target.value)}
                                            placeholder="키를 입력하세요 (AI Studio에서 발급)"
                                            className="w-full p-3 bg-slate-100 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                        />
                                        <p className="text-[10px] text-slate-400">
                                            * 키는 브라우저의 로컬 스토리지에만 저장되며 외부로 전송되지 않습니다.
                                        </p>
                                    </div>
                                    <button 
                                        type="submit"
                                        className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold transition-all shadow-lg shadow-blue-200"
                                    >
                                        설정 저장
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    <footer className="py-8 text-center text-slate-400 text-[10px] tracking-tight uppercase font-medium">
                        <p>© 2025 SOCIAL SCHOOL SUNDAY NIGHT BOOK-TALK HOST TOOL</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
